name: Build macOS arm64
run-name: macOS arm64 · ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Check runner and install locked dependencies
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Build DMG (ad-hoc signed, not notarized)
        run: pnpm package:mac
      - name: Verify packaged Host and MCP with bundled Electron
        run: node scripts/verify-package.mjs release/mac-arm64/Wisp.app/Contents/Resources/app release/mac-arm64/Wisp.app/Contents/MacOS/Wisp arm64
      - name: Record build identity and checksum in summary
        id: package
        run: node scripts/package-manifest.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
